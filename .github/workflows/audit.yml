name: caPOS Security & Quality Audit

# Jalan otomatis di cloud (GitHub-hosted runner) setiap ada push/PR ke main,
# plus jadwal mingguan. Tidak ada satupun tools di sini yang perlu di-install
# di laptop kamu - semuanya "terinstal sementara" di server GitHub lalu
# dibuang lagi setelah job selesai.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # setiap Senin jam 03:00 UTC

jobs:
  code-quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 1. Dependency vulnerability scan (setara "npm audit" tapi otomatis)
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # 2. Circular dependency / spaghetti code check
      - name: Check circular dependencies (madge)
        run: npx madge --circular --extensions ts,tsx app lib components

      # 3. Lint + deteksi kompleksitas tinggi
      #    Next.js 16 menghapus `next lint`, jadi panggil ESLint langsung
      #    dengan flat config (eslint.config.mjs).
      - name: Lint
        run: npx eslint .

      # 4. Dead code / unused export
      - name: Check unused exports
        run: npx ts-prune

  # 5. OWASP ZAP baseline scan ke URL production/preview di Vercel.
  #    Ini men-simulasikan serangan dasar (header keamanan, XSS reflektif,
  #    dsb) tanpa kamu perlu install ZAP sama sekali.
  zap-scan:
    permissions:
      contents: read
      # Wajib: action-baseline otomatis membuat GitHub Issue berisi hasil
      # scan. Tanpa `issues: write`, GITHUB_TOKEN tidak bisa menulis issue
      # dan job gagal dengan "Resource not accessible by integration" -
      # SEKALIPUN scan-nya sendiri sukses.
      issues: write
      # Wajib: upload artifact laporan ZAP lewat Artifacts API. Tanpa
      # `actions: write` GitHub membalas HTTP 400 dengan pesan misleading
      # "The artifact name ... is not valid" - padahal nama sudah lolos
      # validasi client ("Artifact name is valid!"). bukan masalah nama.
      actions: write
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: ZAP Baseline Scan
        # v0.12.0 masih pakai client Artifacts API v3 (api-version=6.0-preview)
        # yang sudah dinonaktifkan GitHub, sehingga upload laporan selalu
        # HTTP 400 "artifact name ... is not valid" apa pun nama yang dipakai.
        # v0.15.0 memakai client artifact v4 dan runtime node24.
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://ca-pos-sooty.vercel.app/" # ganti dengan URL Vercel-mu
          fail_action: false # set true kalau mau job gagal saat ada temuan
          allow_issue_writing: true # perlu permissions: issues: write di atas
          artifact_name: zap-baseline-report
