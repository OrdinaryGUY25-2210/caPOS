name: caPOS Security & Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  code-quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gate utama: hanya dependency yang ikut ter-deploy (production).
      - name: Audit production dependencies (gate)
        run: npm audit --omit=dev --audit-level=high

      # Devdependencies hanya dilaporkan, tidak menggagalkan CI.
      - name: Audit dev dependencies (informasional)
        run: npm audit --audit-level=high || true

      - name: Check circular dependencies (madge)
        run: npx madge --circular --extensions ts,tsx app lib components

      - name: Lint
        run: npx eslint .

      - name: Check unused exports
        run: npx ts-prune || true

  zap-scan:
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ubuntu-latest
    # Jalankan ZAP meski code-quality gagal, agar scan keamanan tidak ter-skip.
    needs: code-quality
    if: ${{ always() }}
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://ca-pos-sooty.vercel.app/"
          fail_action: false
          allow_issue_writing: true
          artifact_name: zap-baseline-report
