<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>caPOS — Offline</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F8FAFC; color: #0F172A;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; padding: 24px; max-width: 320px; }
    .icon { width: 56px; height: 56px; border-radius: 16px; background: #10B981;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #64748B; line-height: 1.5; }
    button { margin-top: 16px; background: #10B981; color: white; border: none; padding: 10px 20px;
             border-radius: 12px; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">☕</div>
    <h1>Halaman Ini Belum Pernah Dibuka</h1>
    <p>Kamu sedang offline dan halaman ini belum sempat tersimpan di perangkat.
       Buka sekali saat online supaya bisa diakses offline berikutnya, atau coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
